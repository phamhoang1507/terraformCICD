name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Môi trường deploy"
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy-api:
    name: Deploy API to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    container:
      image: public.ecr.aws/y3h5z9v5/clound:001
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API
        run: echo "Deploying API to ${{ inputs.environment }}..."